<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050b14" />
  <title>Activate a machine</title>
  <link rel="icon" href="assets/washer.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/site.css" />
  <script src="assets/site-data.js" defer></script>
  <script src="assets/bluetooth.js" defer></script>
  <script src="assets/activate.js" defer></script>
</head>
<body>
  <div class="activation-shell">
    <main>
      <section class="location-summary" aria-labelledby="siteTitle">
        <div class="site-heading">
          <h1 id="siteTitle">Loading…</h1>
          <a id="changeSiteBtn" class="secondary-button" href="index.html?change=1">Change site</a>
        </div>
      </section>
      <p id="pageStatus" role="status" aria-live="polite">Loading machines…</p>
      <button id="retrySite" class="secondary-button" type="button" hidden>Try again</button>
      <div id="machineControls" class="control-stack" hidden>
        <section class="panel machine-panel" aria-label="Machine selection">
          <button id="machinePickerTrigger" class="machine-selector" type="button" aria-haspopup="dialog">
            <span class="machine-icon"><img id="machineIcon" src="assets/washer.svg" alt="" /></span>
            <span class="machine-copy"><strong id="machineName"></strong><small id="machineId"></small></span>
            <span class="machine-change">Change <span aria-hidden="true">⌄</span></span>
          </button>
        </section>
        <section id="connectionPanel" class="panel connection-panel" data-state="ready" aria-labelledby="connectionTitle">
          <div class="connection-icon" aria-hidden="true"><img src="assets/connect.svg" alt="" /></div>
          <div class="connection-copy" role="status" aria-live="polite" aria-atomic="true">
            <h2 id="connectionTitle">Ready to connect</h2>
            <p id="connectionHint" hidden></p>
          </div>
          <button id="connectBtn" class="primary-button" type="button">Connect <span aria-hidden="true">→</span></button>
          <a id="bluefyLink" class="browser-link" href="https://apps.apple.com/us/app/bluefy-web-ble-browser/id1492822055" target="_blank" rel="noopener noreferrer" hidden>Get Bluefy for iPhone or iPad ↗</a>
        </section>
        <section class="panel cycle-panel" aria-labelledby="cycleTitle">
          <div class="section-heading"><h2 id="cycleTitle">Choose a cycle</h2><span id="connectionDot" class="connection-dot" aria-hidden="true"></span></div>
          <div id="machineButtons" class="machine-actions"></div>
        </section>
      </div>
      <noscript><p>Enable JavaScript to activate a machine.</p></noscript>
    </main>
  </div>
  <dialog id="machinePicker" aria-labelledby="machinePickerTitle">
    <div class="dialog-heading"><h2 id="machinePickerTitle">Choose a machine</h2><button id="closeMachinePicker" class="secondary-button" type="button">Close</button></div>
    <div id="machinePickerList" class="machine-list"></div>
  </dialog>
</body>
</html>
