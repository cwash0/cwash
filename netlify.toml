[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/data/**"]

[[headers]]
  for = "/assets/activate.*"

  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate, private"
    Pragma = "no-cache"
    Expires = "0"
    X-Robots-Tag = "noindex, nofollow"

