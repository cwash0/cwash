[[redirects]]
  from = "https://cwash.netlify.app/*"
  to = "https://circuitwash.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/preview/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/functions/*"
  to = "/404.html"
  status = 404
  force = true
