<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Contact support | CircuitWash</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/support.css" />
</head>
<body>
  <main class="support-page">
    <header class="support-header">
      <a class="brand" href="/" aria-label="CircuitWash home"><span aria-hidden="true"></span>CircuitWash</a>
      <a id="support-back" class="back-link" href="/">Back</a>
    </header>

    <section class="support-card" aria-labelledby="support-title">
      <div id="support-form-view">
        <p class="eyebrow">CircuitWash support</p>
        <h1 id="support-title">How can we help?</h1>
        <p class="intro">Send us a message and we’ll reply to your email.</p>

        <form id="support-form" novalidate>
          <label for="support-email">Email</label>
          <input id="support-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="320" required />

          <label for="support-message">Message</label>
          <textarea id="support-message" name="message" rows="7" minlength="10" maxlength="10000" required placeholder="Tell us what happened."></textarea>

          <p id="support-error" class="form-message" role="alert" aria-live="polite"></p>
          <button id="support-submit" type="submit"><span class="button-label">Send message</span><span class="button-spinner" aria-hidden="true"></span></button>
        </form>
      </div>

      <div id="support-success" class="success-view" hidden tabindex="-1">
        <span class="success-icon" aria-hidden="true">✓</span>
        <p class="eyebrow">Request sent</p>
        <h1>We’ve got your message.</h1>
        <p>We’ll reply to <strong id="support-success-email"></strong>. Your reference is <strong id="support-ticket-id"></strong>.</p>
        <a class="primary-link" href="/">Back to CircuitWash</a>
      </div>
    </section>
  </main>
  <script src="assets/funnel-analytics.js"></script>
  <script src="assets/support.js?v=back-navigation-1"></script>
</body>
</html>
