<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="color-scheme" content="dark" />
  <title>Page not found | CircuitWash</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(15, 23, 42, .94);
      --border: rgba(148, 163, 184, .16);
      --text: #e8f0fc;
      --muted: #99aac2;
      --accent: #22d3ee;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      font-family: var(--font);
      background:
        radial-gradient(circle at 12% 0%, rgba(34, 211, 238, .18), transparent 30%),
        radial-gradient(circle at 92% 4%, rgba(124, 58, 237, .18), transparent 31%),
        linear-gradient(180deg, #08111f 0%, #0b1322 48%, #07111b 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 30px 30px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 82%);
    }

    main {
      position: relative;
      width: min(100%, 620px);
      padding: clamp(28px, 7vw, 48px);
      border: 1px solid var(--border);
      border-radius: 26px;
      text-align: center;
      background: var(--panel);
      box-shadow: 0 24px 65px rgba(0,0,0,.3);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      color: #dbe8f8;
      font-weight: 800;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(34, 211, 238, .72);
    }

    .code {
      width: 100%;
      margin: 0;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 850;
      letter-spacing: .13em;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 10px;
      font-size: clamp(2.2rem, 9vw, 4rem);
      line-height: 1;
      letter-spacing: -.055em;
    }

    p {
      max-width: 440px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 28px;
    }

    a.button {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 820;
    }

    .primary {
      color: #04111b;
      background: var(--accent);
      box-shadow: 0 12px 28px rgba(34,211,238,.18);
    }

    .secondary {
      color: var(--text);
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
    }

    .support {
      margin-top: 24px;
      color: #7f91aa;
      font-size: .8rem;
    }

    .support a {
      color: #b7c7db;
    }

    @media (max-width: 520px) {
      main {
        padding: 28px 20px;
        border-radius: 22px;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      CircuitWash
    </div>

    <p class="code">404 - PAGE NOT FOUND</p>
    <h1>That page isn’t here.</h1>
    <p>The link may be outdated, or the page may have moved. You can return home or go straight to machine activation.</p>

    <div class="actions">
      <a class="button primary" href="/">Return home</a>
      <a class="button secondary" href="/activate.html">Activate a machine</a>
    </div>

    <div class="support">
      Need help? <a href="/support.html?source=%2F404.html">Contact support</a>
    </div>
  </main>
</body>
</html>
